<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>企鵝妹的數字描寫｜數字 2</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
body{background:linear-gradient(180deg,#fbdbea,#f8e8f6 48%,#eaf2ff);color:#5b3c62;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.app{width:100%;min-height:100svh;display:flex;justify-content:center}
.shell{width:min(100%,760px);min-height:100svh;padding:12px 12px 22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.homeBtn,.soundBtn{border:0;border-radius:18px;background:rgba(255,255,255,.86);box-shadow:0 5px 14px rgba(120,70,130,.12);color:#70456f;font-weight:800;font-size:15px;padding:10px 12px}
.title{text-align:center;line-height:1;flex:1}
.crown{font-size:25px;display:block;margin-bottom:2px}
.title h1{margin:0;font-size:clamp(24px,7vw,40px);letter-spacing:.04em;color:#9a4f91;text-shadow:0 2px 0 #fff}
.subtitle{margin:9px auto 12px;width:max-content;max-width:94%;padding:8px 17px;border-radius:999px;background:#fff9ff;box-shadow:0 4px 12px rgba(120,70,130,.1);font-weight:800;color:#a45a91}
.card{background:rgba(255,255,255,.88);border:3px solid #fff;border-radius:30px;box-shadow:0 10px 28px rgba(120,70,130,.13);padding:14px}
.guide{display:flex;align-items:center;justify-content:center;gap:8px;color:#70456f;font-weight:900;font-size:17px;margin-bottom:9px}
.penguin{font-size:35px}
.writeArea{position:relative;width:100%;aspect-ratio:1/1.03;margin:auto;border-radius:25px;overflow:hidden;background:linear-gradient(145deg,#fff8fd,#f5ecff);border:3px solid #f2c9e4;touch-action:none;overscroll-behavior:contain}
.trace{position:absolute;inset:5%;width:90%;height:90%;pointer-events:none}
.trace path{fill:none;stroke:#d9b7d9;stroke-width:22;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 34}
.trace .arrow{stroke:#ef9bc9;stroke-width:8;stroke-dasharray:none}
#drawCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hint{position:absolute;left:50%;bottom:13px;transform:translateX(-50%);white-space:nowrap;background:rgba(255,255,255,.93);border-radius:999px;padding:7px 14px;color:#9b5c91;font-weight:900;box-shadow:0 4px 12px rgba(120,70,130,.1);pointer-events:none;font-size:14px}
.controls{display:flex;gap:10px;margin-top:12px}
.controls button{flex:1;border:0;border-radius:18px;padding:12px 10px;font-size:17px;font-weight:900;box-shadow:0 6px 14px rgba(120,70,130,.13)}
.clear{background:#fff;color:#9b5c91}.done{background:linear-gradient(180deg,#f46eb0,#df4f9b);color:white}
.status{text-align:center;min-height:27px;margin:10px 0 0;font-weight:900;color:#8a5683}
.progress{display:flex;justify-content:center;gap:7px;margin-top:8px}.dot{width:10px;height:10px;border-radius:50%;background:#e8cce5}.dot.active{background:#ec6cac}
footer{text-align:center;margin-top:12px;color:#9b7198;font-size:14px;font-weight:700}
@media(max-width:430px){.shell{padding:9px 9px 17px}.homeBtn,.soundBtn{font-size:13px;padding:9px 10px}.title h1{font-size:26px}.subtitle{font-size:14px;margin-bottom:9px}.card{padding:10px;border-radius:24px}.guide{font-size:15px}.writeArea{aspect-ratio:1/1.02}.hint{font-size:12px;padding:7px 11px}}
</style>
</head>
<body>
<div class="app"><main class="shell">
<div class="top">
<button class="homeBtn" onclick="goHome()">👑 王國首頁</button>
<div class="title"><span class="crown">👑</span><h1>企鵝妹的數字描寫</h1></div>
<button class="soundBtn" id="soundBtn" onclick="toggleSound()">🔊</button>
</div>
<div class="subtitle">🐧 今天一起學寫數字吧！ ✨</div>
<section class="card">
<div class="guide"><span class="penguin">🐧</span>跟著小企鵝的路線，寫出漂亮的「2」！</div>
<div class="writeArea" id="writeArea">
<svg class="trace" viewBox="0 0 400 420" aria-hidden="true">
<path d="M115 125 C115 72 170 48 225 58 C292 70 310 123 276 174 C246 219 180 246 132 300 C111 323 100 344 96 366 L305 366"/>
<path class="arrow" d="M113 120 C125 83 167 65 207 69"/>
</svg>
<canvas id="drawCanvas"></canvas>
<div class="hint" id="hint">👆 用手指沿著虛線描一遍</div>
</div>
<div class="controls"><button class="clear" onclick="clearDrawing()">🔄 再寫一次</button><button class="done" onclick="finishWriting()">✨ 寫好了！</button></div>
<div class="status" id="status"></div>
<div class="progress"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
</section>
<footer>🌸 每一次練習，都是數學冒險的一小步！ 💗</footer>
</main></div>
<script>
const canvas=document.getElementById("drawCanvas"),ctx=canvas.getContext("2d"),hint=document.getElementById("hint"),statusEl=document.getElementById("status");
let drawing=false,hasInk=false,soundOn=true,audioCtx=null;
function resizeCanvas(){const r=canvas.getBoundingClientRect(),d=Math.max(1,Math.min(2,devicePixelRatio||1));canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);ctx.lineCap="round";ctx.lineJoin="round"}
function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function start(e){e.preventDefault();drawing=true;hasInk=true;canvas.setPointerCapture?.(e.pointerId);const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);hint.style.opacity=".3"}
function move(e){if(!drawing)return;e.preventDefault();const p=pos(e);ctx.strokeStyle="#ef5ca8";ctx.lineWidth=Math.max(7,Math.min(13,canvas.clientWidth*.025));ctx.lineTo(p.x,p.y);ctx.stroke()}
function end(e){if(!drawing)return;e.preventDefault();drawing=false;playTone(660,.06)}
canvas.addEventListener("pointerdown",start,{passive:false});canvas.addEventListener("pointermove",move,{passive:false});canvas.addEventListener("pointerup",end,{passive:false});canvas.addEventListener("pointercancel",end,{passive:false});addEventListener("resize",resizeCanvas);resizeCanvas();
function clearDrawing(){ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);hasInk=false;hint.style.opacity="1";statusEl.textContent="";playTone(420,.05)}
function finishWriting(){if(!hasInk){statusEl.textContent="👆 先寫一寫數字 2，再來告訴小企鵝完成囉！";playTone(330,.08);return}statusEl.textContent="🎉 太棒了！你完成數字「2」了！";document.querySelectorAll(".dot")[1].classList.add("active");playTone(880,.08);setTimeout(()=>playTone(1046,.1),90)}
function toggleSound(){soundOn=!soundOn;document.getElementById("soundBtn").textContent=soundOn?"🔊":"🔇"}
function playTone(freq,dur){if(!soundOn)return;audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type="sine";g.gain.setValueAtTime(.1,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}
function goHome(){location.href="https://doris80080.github.io/"}
</script>
</body>
</html>
