<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>企鵝妹的數字描寫｜1～10</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
body{background:linear-gradient(180deg,#fbdbea 0%,#f8e8f6 48%,#eaf2ff 100%);color:#5b3c62;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
.app{min-height:100svh;display:flex;justify-content:center}
.shell{width:min(100%,760px);min-height:100svh;padding:10px 12px 22px}
.top{display:flex;align-items:center;gap:8px}
.homeBtn,.soundBtn{border:0;border-radius:18px;background:rgba(255,255,255,.88);box-shadow:0 5px 14px rgba(120,70,130,.12);color:#70456f;font-weight:900;font-size:15px;padding:10px 12px}
.title{text-align:center;flex:1;line-height:1}
.crown{font-size:24px;display:block}.title h1{margin:3px 0 0;font-size:clamp(24px,7vw,40px);color:#98518f;text-shadow:0 2px #fff}
.subtitle{margin:9px auto 12px;width:max-content;max-width:94%;padding:8px 17px;border-radius:999px;background:#fff9ff;box-shadow:0 4px 12px #9b6a8b20;font-weight:900;color:#a45a91}
.card{background:#ffffffdf;border:3px solid #fff;border-radius:30px;box-shadow:0 10px 28px #78468222;padding:14px}
.selector{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:13px}
.numBtn{border:0;border-radius:16px;background:#fff4fb;color:#88507f;font-weight:1000;font-size:22px;padding:10px 3px;box-shadow:0 4px 10px #78468218}
.numBtn.active{background:linear-gradient(180deg,#f875b4,#df4d9c);color:white;transform:translateY(-1px)}
.guide{text-align:center;font-weight:900;font-size:17px;margin:2px 0 9px;color:#70456f}
.writeArea{position:relative;width:100%;aspect-ratio:1/1.02;border-radius:25px;overflow:hidden;background:linear-gradient(145deg,#fff8fd,#f5ecff);border:3px solid #f2c9e4;touch-action:none;overscroll-behavior:contain}
.trace{position:absolute;inset:4%;width:92%;height:92%;pointer-events:none}
.trace path{fill:none;stroke:#d7b5d8;stroke-width:24;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 34}
#drawCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hint{position:absolute;left:50%;bottom:13px;transform:translateX(-50%);white-space:nowrap;background:#fffffff2;border-radius:999px;padding:7px 14px;color:#9b5c91;font-weight:900;box-shadow:0 4px 12px #78468218;pointer-events:none;font-size:14px}
.controls{display:flex;gap:10px;margin-top:12px}
.controls button{flex:1;border:0;border-radius:18px;padding:12px 10px;font-size:17px;font-weight:900;box-shadow:0 6px 14px #78468220}
.clear{background:#fff;color:#9b5c91}.done{background:linear-gradient(180deg,#f46eb0,#df4f9b);color:white}
.status{text-align:center;min-height:27px;margin:10px 0 0;font-weight:900;color:#8a5683}
.progress{display:flex;justify-content:center;gap:7px;margin-top:7px}.dot{width:10px;height:10px;border-radius:50%;background:#e8cce5}.dot.active{background:#ec6cac}
footer{text-align:center;margin-top:12px;color:#9b7198;font-size:14px;font-weight:700}
@media(max-width:430px){.shell{padding:8px 9px 17px}.homeBtn,.soundBtn{font-size:13px;padding:9px 10px}.title h1{font-size:25px}.subtitle{font-size:14px;margin-bottom:9px}.card{padding:10px;border-radius:24px}.selector{gap:6px}.numBtn{font-size:19px;padding:9px 2px}.guide{font-size:15px}.hint{font-size:12px;padding:7px 11px}}
</style>
</head>
<body>
<div class="app"><main class="shell">
<div class="top">
<button class="homeBtn" onclick="goHome()">👑 王國首頁</button>
<div class="title"><span class="crown">👑</span><h1>企鵝妹的數字描寫</h1></div>
<button class="soundBtn" id="soundBtn" onclick="toggleSound()">🔊</button>
</div>
<div class="subtitle">🐧 選一個數字，開始描寫冒險吧！ ✨</div>

<section class="card">
<div class="selector" id="selector"></div>
<div class="guide" id="guide">🐧 跟著小企鵝的路線，寫出漂亮的「2」！</div>
<div class="writeArea">
<svg class="trace" viewBox="0 0 400 420" aria-hidden="true"><path id="tracePath"/></svg>
<canvas id="drawCanvas"></canvas>
<div class="hint" id="hint">👆 用手指沿著虛線描一遍</div>
</div>
<div class="controls">
<button class="clear" onclick="clearDrawing()">🔄 再寫一次</button>
<button class="done" onclick="finishWriting()">✨ 寫好了！</button>
</div>
<div class="status" id="status"></div>
<div class="progress" id="progress"></div>
</section>
<footer>🌸 每一次練習，都是數學冒險的一小步！ 💗</footer>
</main></div>

<script>
const paths={
1:"M205 82 L205 360 M175 108 L205 82",
2:"M112 122 C112 70 166 48 222 60 C286 74 304 124 271 174 C243 216 180 246 132 300 C111 323 100 345 96 365 L305 365",
3:"M116 92 C164 52 246 55 276 102 C299 139 272 172 224 185 C273 193 299 222 286 271 C272 326 191 375 112 332",
4:"M267 350 L267 82 L92 262 L310 262 M92 262 L92 288",
5:"M287 82 L122 82 L108 208 C150 180 230 184 270 218 C315 257 290 336 218 360 C161 378 111 347 94 315",
6:"M282 92 C244 61 178 70 139 119 C104 164 93 244 122 305 C153 369 246 376 286 324 C320 280 299 222 251 207 C203 191 148 210 122 251",
7:"M94 86 L302 86 L184 365",
8:"M202 208 C143 205 110 170 119 118 C128 65 186 48 230 66 C275 84 284 133 251 166 C229 188 198 202 202 208 C198 214 229 228 251 250 C286 285 274 337 230 355 C184 374 127 353 119 302 C110 250 143 211 202 208",
9:"M276 285 C240 335 170 357 127 314 C85 273 105 204 156 190 C207 177 274 206 287 260 C301 322 277 347 249 362 M156 190 C114 164 111 105 149 73 C188 40 250 57 276 95 C299 130 286 175 258 196",
10:"M112 122 C112 70 166 48 222 60 C286 74 304 124 271 174 C243 216 180 246 132 300 C111 323 100 345 96 365 L305 365 M286 85 L286 365"
};
let current=2,drawing=false,hasInk=false,soundOn=true,audioCtx=null;
const canvas=document.getElementById("drawCanvas"),ctx=canvas.getContext("2d");
const pathEl=document.getElementById("tracePath"),guide=document.getElementById("guide"),hint=document.getElementById("hint"),statusEl=document.getElementById("status");

function buildSelector(){
 const box=document.getElementById("selector");
 for(let i=1;i<=10;i++){
  const b=document.createElement("button");b.className="numBtn"+(i===current?" active":"");b.textContent=i;
  b.onclick=()=>selectNumber(i);box.appendChild(b);
 }
}
function selectNumber(n){
 current=n; hasInk=false; statusEl.textContent="";hint.style.opacity="1";
 document.querySelectorAll(".numBtn").forEach((b,i)=>b.classList.toggle("active",i===n-1));
 guide.textContent=`🐧 跟著小企鵝的路線，寫出漂亮的「${n}」！`;
 pathEl.setAttribute("d",paths[n]);
 clearCanvasOnly();playTone(620,.05);
}
function clearCanvasOnly(){ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight)}
function resizeCanvas(){const r=canvas.getBoundingClientRect(),d=Math.max(1,Math.min(2,devicePixelRatio||1));canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);ctx.lineCap="round";ctx.lineJoin="round"}
function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function start(e){e.preventDefault();drawing=true;hasInk=true;canvas.setPointerCapture?.(e.pointerId);const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);hint.style.opacity=".3"}
function move(e){if(!drawing)return;e.preventDefault();const p=pos(e);ctx.strokeStyle="#ef5ca8";ctx.lineWidth=Math.max(7,Math.min(13,canvas.clientWidth*.025));ctx.lineTo(p.x,p.y);ctx.stroke()}
function end(e){if(!drawing)return;e.preventDefault();drawing=false;playTone(660,.06)}
canvas.addEventListener("pointerdown",start,{passive:false});canvas.addEventListener("pointermove",move,{passive:false});canvas.addEventListener("pointerup",end,{passive:false});canvas.addEventListener("pointercancel",end,{passive:false});addEventListener("resize",resizeCanvas);

function clearDrawing(){clearCanvasOnly();hasInk=false;hint.style.opacity="1";statusEl.textContent="";playTone(420,.05)}
function finishWriting(){
 if(!hasInk){statusEl.textContent=`👆 先寫一寫數字 ${current}，再告訴小企鵝完成囉！`;playTone(330,.08);return}
 statusEl.textContent=`🎉 太棒了！你完成數字「${current}」了！`;
 playTone(880,.08);setTimeout(()=>playTone(1046,.1),90);
}
function toggleSound(){soundOn=!soundOn;document.getElementById("soundBtn").textContent=soundOn?"🔊":"🔇"}
function playTone(freq,dur){if(!soundOn)return;audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type="sine";g.gain.setValueAtTime(.1,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}
function goHome(){location.href="https://doris80080.github.io/"}
buildSelector();selectNumber(2);resizeCanvas();
</script>
</body>
</html>
