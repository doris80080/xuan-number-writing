<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>企鵝妹的數字描寫｜1～10</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
body{background:linear-gradient(180deg,#f9cce1 0%,#fbe4f2 42%,#f3e9ff 100%);color:#6b3e70;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{min-height:100svh;display:flex;justify-content:center}
.shell{width:min(100%,760px);min-height:100svh;padding:0 10px 22px}
.hero{position:relative;width:100%;margin:0 auto;line-height:0}
.hero img{display:block;width:100%;height:auto;border-radius:0 0 24px 24px;object-fit:contain}
.homeBtn,.soundBtn{position:absolute;top:18px;z-index:3;border:0;border-radius:999px;background:rgba(255,255,255,.94);box-shadow:0 6px 16px rgba(120,70,130,.14);color:#70456f;font-weight:900;font-size:15px;padding:11px 15px;line-height:1.15}
.homeBtn{left:16px}.soundBtn{right:16px;font-size:19px;padding:11px 14px}
.card{margin-top:0;background:rgba(255,255,255,.93);border:3px solid #fff;border-radius:30px;box-shadow:0 10px 28px rgba(120,70,130,.14);padding:15px}
.selector{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:14px}
.numBtn{border:0;border-radius:17px;background:linear-gradient(180deg,#fff8fd,#f9edf8);color:#824878;font-weight:1000;font-size:23px;padding:11px 3px;box-shadow:0 5px 12px rgba(120,70,130,.08)}
.numBtn.active{background:linear-gradient(180deg,#f66fb0,#df4c9b);color:#fff;transform:translateY(-1px);box-shadow:0 7px 15px rgba(223,76,155,.25)}
.guide{text-align:center;font-weight:1000;font-size:18px;margin:2px 0 11px;color:#70456f}
.writeArea{position:relative;width:100%;aspect-ratio:1/1;border-radius:26px;overflow:hidden;background:linear-gradient(145deg,#fff8fd,#f6edff);border:4px solid #efc5e3;touch-action:none;overscroll-behavior:contain}
.trace{position:absolute;inset:4%;width:92%;height:92%;pointer-events:none}
.trace path{fill:none;stroke:#d6b0d8;stroke-width:24;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 34}
#drawCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.controls{display:flex;gap:12px;margin-top:13px}
.controls button{flex:1;border:0;border-radius:20px;padding:14px 10px;font-size:19px;font-weight:1000;box-shadow:0 7px 16px rgba(120,70,130,.12);min-height:58px}
.clear{background:#fff;color:#8d5587}.done{background:linear-gradient(180deg,#f46eb0,#df4f9b);color:white}
.status{text-align:center;min-height:28px;margin:10px 0 0;font-weight:1000;color:#8a5683}
footer{text-align:center;margin-top:13px;color:#9b7198;font-size:15px;font-weight:800;padding-bottom:4px}
@media(max-width:430px){
 .shell{padding:0 8px 15px}
 .hero img{border-radius:0 0 20px 20px}
 .homeBtn,.soundBtn{top:16px;font-size:13px;padding:9px 12px}.soundBtn{font-size:18px;padding:9px 11px}
 .card{padding:10px;border-radius:24px}
 .selector{gap:7px}.numBtn{font-size:20px;padding:10px 2px}
 .guide{font-size:16px;margin-bottom:9px}
 .controls{gap:9px;margin-top:10px}.controls button{font-size:18px;padding:12px 8px;min-height:56px}
}
</style>
</head>
<body>
<div class="app"><main class="shell">
<header class="hero">
  <img src="xuan-number-writing-hero.webp" alt="企鵝妹的數字描寫童話冒險主視覺">
  <button class="homeBtn" onclick="goHome()">👑 王國首頁</button>
  <button class="soundBtn" id="soundBtn" onclick="toggleSound()" aria-label="音效開關">🔊</button>
</header>

<section class="card">
  <div class="selector" id="selector"></div>
  <div class="guide" id="guide">🐧 跟著小企鵝的路線，寫出漂亮的「2」！</div>
  <div class="writeArea">
    <svg class="trace" viewBox="0 0 400 420" aria-hidden="true"><path id="tracePath"/></svg>
    <canvas id="drawCanvas"></canvas>
  </div>
  <div class="controls">
    <button class="clear" onclick="clearDrawing()">🔄 再寫一次</button>
    <button class="done" onclick="finishWriting()">✨ 寫好了！</button>
  </div>
  <div class="status" id="status"></div>
</section>
<footer>🌸 每一次練習，都是數學冒險的一小步！ 💗</footer>
</main></div>

<script>
const paths={
1:["M205 82 L205 360","M175 108 L205 82"],
2:["M112 122 C112 70 166 48 222 60 C286 74 304 124 271 174 C243 216 180 246 132 300 C111 323 100 345 96 365 L305 365"],
3:["M116 92 C164 52 246 55 276 102 C299 139 272 172 224 185 C273 193 299 222 286 271 C272 326 191 375 112 332"],
4:["M267 350 L267 82 L92 262 L310 262","M92 262 L92 288"],
5:["M287 82 L122 82 L108 208 C150 180 230 184 270 218 C315 257 290 336 218 360 C161 378 111 347 94 315"],
6:["M282 92 C244 61 178 70 139 119 C104 164 93 244 122 305 C153 369 246 376 286 324 C320 280 299 222 251 207 C203 191 148 210 122 251"],
7:["M94 86 L302 86 L184 365"],
8:["M202 208 C143 205 110 170 119 118 C128 65 186 48 230 66 C275 84 284 133 251 166 C229 188 198 202 202 208 C198 214 229 228 251 250 C286 285 274 337 230 355 C184 374 127 353 119 302 C110 250 143 211 202 208"],
9:["M112 160 C112 100 150 62 202 62 C254 62 286 103 286 158 C286 214 249 250 199 250 C149 250 112 215 112 160","M286 158 C296 220 294 292 282 365"],
10:["M88 118 L128 82 L128 365","M228 82 C178 82 158 118 158 224 C158 330 178 365 228 365 C278 365 298 330 298 224 C298 118 278 82 228 82"]
};
let current=2,drawing=false,hasInk=false,soundOn=true,audioCtx=null;
const canvas=document.getElementById("drawCanvas"),ctx=canvas.getContext("2d");
const pathEl=document.getElementById("tracePath"),guide=document.getElementById("guide"),statusEl=document.getElementById("status");

function buildSelector(){
 const box=document.getElementById("selector");
 for(let i=1;i<=10;i++){
  const b=document.createElement("button");
  b.className="numBtn"+(i===current?" active":"");
  b.textContent=i;
  b.onclick=()=>selectNumber(i);
  box.appendChild(b)
 }
}
function selectNumber(n){
 current=n;hasInk=false;statusEl.textContent="";
 document.querySelectorAll(".numBtn").forEach((b,i)=>b.classList.toggle("active",i===n-1));
 guide.textContent=`🐧 跟著小企鵝的路線，寫出漂亮的「${n}」！`;
 renderTrace();clearCanvasOnly();playTone(620,.05)
}
function renderTrace(){
 pathEl.setAttribute("d",paths[current][0]);
 while(pathEl.nextElementSibling)pathEl.nextElementSibling.remove();
 for(let i=1;i<paths[current].length;i++){
  const p=document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d",paths[current][i]);
  pathEl.parentNode.appendChild(p)
 }
}
function clearCanvasOnly(){ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight)}
function resizeCanvas(){
 const r=canvas.getBoundingClientRect(),d=Math.max(1,Math.min(2,devicePixelRatio||1));
 canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);
 ctx.setTransform(d,0,0,d,0,0);ctx.lineCap="round";ctx.lineJoin="round"
}
function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function start(e){e.preventDefault();drawing=true;hasInk=true;canvas.setPointerCapture?.(e.pointerId);const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)}
function move(e){
 if(!drawing)return;e.preventDefault();const p=pos(e);
 ctx.strokeStyle="#ef5ca8";ctx.lineWidth=Math.max(7,Math.min(13,canvas.clientWidth*.025));
 ctx.lineTo(p.x,p.y);ctx.stroke()
}
function end(e){if(!drawing)return;e.preventDefault();drawing=false;playTone(660,.06)}
canvas.addEventListener("pointerdown",start,{passive:false});
canvas.addEventListener("pointermove",move,{passive:false});
canvas.addEventListener("pointerup",end,{passive:false});
canvas.addEventListener("pointercancel",end,{passive:false});
addEventListener("resize",resizeCanvas);

function clearDrawing(){clearCanvasOnly();hasInk=false;statusEl.textContent="";playTone(420,.05)}
function finishWriting(){
 if(!hasInk){statusEl.textContent=`👆 先寫一寫數字 ${current}，再告訴小企鵝完成囉！`;playTone(330,.08);return}
 statusEl.textContent=`🎉 太棒了！你完成數字「${current}」了！`;
 playTone(880,.08);setTimeout(()=>playTone(1046,.1),90)
}
function toggleSound(){soundOn=!soundOn;document.getElementById("soundBtn").textContent=soundOn?"🔊":"🔇"}
function playTone(freq,dur){
 if(!soundOn)return;
 audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
 if(audioCtx.state==="suspended")audioCtx.resume();
 const o=audioCtx.createOscillator(),g=audioCtx.createGain();
 o.frequency.value=freq;o.type="sine";
 g.gain.setValueAtTime(.1,audioCtx.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
 o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)
}
function goHome(){location.href="https://doris80080.github.io/"}
buildSelector();selectNumber(2);resizeCanvas();
</script>
</body>
</html>
